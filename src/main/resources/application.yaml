spring:
  application:
    name: turnos-service
  config:
    import: optional:file:.env[.properties]

  datasource:
    url: jdbc:postgresql://localhost:${DB_PORT}/${DB_NAME}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}
    consumer:
      group-id: ${KAFKA_CONSUMER_GROUP}

catedra:
  api:
    base-url: ${CATEDRA_API_URL}
    token: ${CATEDRA_JWT:}

catalogo:
  base-url: ${CATALOGO_URL}
  connect-timeout-ms: 3000
  read-timeout-ms: 5000

server:
  port: 8082

jwt:
  secret: ${JWT_SECRET}
  token-validity-seconds: 86400   # 24 horas
  service-token-validity-seconds: 300

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:}